<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard Tiếng Trung</title>
<meta name="theme-color" content="#f6f1e7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcard 中文">
<style>
  :root {
    --bg: #f6f1e7;
    --surface: #fffdf8;
    --surface-2: #faf6ee;
    --ink: #2a2420;
    --muted: #7a6f66;
    --line: #e4dbcc;
    --grid: #efe8da;
    --shadow: 0 2px 0 #e6dccb, 0 8px 22px rgba(80, 55, 30, .07);
    --accent: #b8322a;
    --accent-soft: #f6e1dd;
    --good: #2f7d4f;
    --good-soft: #dcefe2;
    --gold: #a8771a;
    --gold-soft: #faeecd;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --hz: "PingFang SC", "Hiragino Sans GB", "Heiti SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    /* chuyển động: phản hồi nhấn 100ms, đổi trạng thái 200ms, chuyển cảnh 300ms */
    --fast: 100ms;
    --normal: 200ms;
    --slow: 300ms;
    --ease: cubic-bezier(.2, 0, 0, 1);
    --ease-in: cubic-bezier(0, 0, .2, 1);
    --ease-out: cubic-bezier(.4, 0, 1, 1);
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1816;
      --surface: #25211e;
      --surface-2: #2c2723;
      --ink: #f1ebe3;
      --muted: #a89c90;
      --line: #3a342f;
      --grid: #221f1c;
      --shadow: 0 2px 0 #14110f, 0 8px 22px rgba(0, 0, 0, .3);
      --accent: #e5675c;
      --accent-soft: #3d2522;
      --good: #6cc391;
      --good-soft: #1f3528;
      --gold: #e0b252;
      --gold-soft: #3a2f17;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .hz { font-family: var(--hz); }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .4; cursor: default; transform: none !important; box-shadow: none !important; }
  [hidden] { display: none !important; }
  .screen { animation: screen-in var(--normal) var(--ease-in); }
  @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } }

  /* mọi thứ bấm được: lún xuống khi nhấn (iPad cần đăng ký touchstart, xem cuối file) */
  .btn, .chip, .lesson, .mode, .opt {
    transition: transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease),
                background-color var(--normal) var(--ease), border-color var(--normal) var(--ease),
                color var(--normal) var(--ease), filter var(--normal) var(--ease);
  }
  .btn:active, .chip:active, .opt:active { transform: translateY(2px) scale(.98); box-shadow: none; }
  .lesson:active, .mode:active { transform: scale(.97); }
  /* chỉ máy có chuột/trackpad mới có trạng thái rê chuột (tránh "dính" hover trên màn cảm ứng) */
  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled), .chip:hover { filter: brightness(.96); transform: translateY(-1px); }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
    .lesson:hover, .mode:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--accent); }
    .opt:hover:not(.right):not(.wrong):not(.dim) { border-color: var(--accent); transform: translateY(-2px); }
    .tile:hover { border-color: var(--accent); }
    .btn:active:not(:disabled), .chip:active { transform: translateY(2px) scale(.98); filter: none; }
    .lesson:active, .mode:active:not(:disabled) { transform: scale(.97); }
  }

  .screen {
    max-width: 1120px; margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  }
  .screen.full {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  /* ---------- nút ---------- */
  .btn {
    min-height: 48px; padding: 10px 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 16px;
    box-shadow: 0 2px 0 var(--line);
    user-select: none; -webkit-user-select: none;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 70%, black); }
  .btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .btn.bad { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .btn.ghost { background: transparent; }
  .chip {
    min-height: 44px; padding: 6px 16px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--surface); font-size: 15px;
  }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .bar { display: block; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .3s ease; }
  .muted { color: var(--muted); }

  /* ---------- màn chính ---------- */
  .home-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .seal {
    width: 56px; height: 56px; border-radius: 14px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 32px; font-weight: 700; flex: none;
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; line-height: 1.2; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .stats { display: flex; gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 104px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .good-t { color: var(--good); } .accent-t { color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
  .grow { flex: 1; }
  /* Bố cục cố định, không phụ thuộc độ dài chữ (số từ, số trên nút thay đổi khi đổi bài),
     để đổi phạm vi không làm các nút nhảy dòng. Màn rộng: 1 hàng; màn hẹp: nút luôn ở hàng dưới. */
  .range-card {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px 18px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
    margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .range-pick { display: flex; align-items: center; gap: 8px 10px; font-weight: 600; white-space: nowrap; }
  .range-pick .muted { font-weight: 400; margin-left: 4px; min-width: 4.6em; font-variant-numeric: tabular-nums; }
  .range-actions { display: grid; grid-template-columns: auto auto; gap: 10px; }
  #mixbtn { min-width: 170px; }
  #unkbtn { min-width: 232px; }
  @media (max-width: 1000px) {
    .range-card { grid-template-columns: 1fr; }
    .range-actions { grid-template-columns: 1fr 1fr; }
    #mixbtn, #unkbtn { min-width: 0; }
  }
  @media (max-width: 480px) {
    .range-pick { flex-wrap: wrap; }
    .range-actions { grid-template-columns: 1fr; }
  }
  select {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); min-height: 44px;
    padding: 8px 34px 8px 14px; border-radius: 12px; border: 1px solid var(--line); background-color: var(--bg);
    -webkit-appearance: none; appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 16px center, right 11px center; background-size: 5px 5px; background-repeat: no-repeat;
    transition: border-color var(--normal) var(--ease);
  }
  select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { select:hover { border-color: var(--accent); } }
  .lesson.in { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
  .foot-actions { display: flex; justify-content: flex-end; margin-top: 22px; }
  .section { font-size: 17px; margin: 0 0 12px; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .lesson {
    text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 104px;
    box-shadow: var(--shadow);
  }
  .lesson.done { border: 2px solid var(--good); }
  .lesson .num { font-size: 13px; color: var(--muted); }
  .lesson .ten { font-size: 18px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lesson .cnt { font-size: 13px; color: var(--muted); margin-top: auto; }

  /* ---------- chọn chế độ ---------- */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; min-height: 48px; }
  .topbar .t { flex: 1; min-width: 0; font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .pos { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .page-title { font-size: 28px; margin: 4px 0 2px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 22px; }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .mode {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px 18px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    box-shadow: var(--shadow); min-height: 290px;
  }
  .mode .ico {
    width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-size: 40px; font-weight: 700; margin-bottom: 6px;
  }
  .mode h3 { margin: 0; font-size: 22px; }
  .mode p { margin: 0; color: var(--muted); font-size: 15px; }
  .mode .foot { margin-top: auto; padding-top: 10px; font-weight: 700; font-size: 15px; }
  .empty-note { text-align: center; color: var(--good); font-weight: 600; margin-top: 18px; }

  /* ---------- lật thẻ ---------- */
  .progress { margin: 0 0 18px; }
  .progress > i { background: var(--accent); }
  .scene { perspective: 1400px; max-width: 820px; margin: 0 auto 18px; }
  /* lớp .drag nhận chuyển động vuốt/bay ra; .card bên trong chỉ lo lật */
  .drag { will-change: transform; animation: card-in var(--normal) var(--ease-in); }
  @keyframes card-in { from { opacity: 0; transform: scale(.96); } }
  .drag.snap { transition: transform var(--normal) var(--spring); }
  .drag.out-left, .drag.out-right, .drag.out-up {
    transition: transform var(--normal) var(--ease-out), opacity var(--normal) var(--ease-out); opacity: 0;
  }
  .drag.out-left { transform: translateX(-60%) rotate(-8deg); }
  .drag.out-right { transform: translateX(60%) rotate(8deg); }
  .drag.out-up { transform: translateY(-30%) scale(.9); }
  .drag.out-up.good .face { border-color: var(--good); box-shadow: 0 0 0 4px var(--good-soft); }
  .drag.out-up.bad .face { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .card {
    position: relative; height: clamp(300px, 50vh, 440px); cursor: pointer;
    transform-style: preserve-3d; transition: transform 380ms var(--ease);
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 22px; background: var(--surface); border: 1px solid var(--line);
    box-shadow: var(--shadow); backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 28px 24px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); }
  .face .tag { position: absolute; top: 14px; left: 18px; font-size: 13px; color: var(--muted); }
  .face .known { position: absolute; top: 12px; right: 14px; font-size: 13px; font-weight: 700; color: var(--good); background: var(--good-soft); padding: 3px 12px; border-radius: 99px; }
  .face .hint { position: absolute; bottom: 14px; font-size: 13px; color: var(--muted); }
  .big { line-height: 1.15; word-break: break-all; }
  .py { color: var(--accent); font-weight: 700; font-size: clamp(22px, 4vw, 32px); }
  .vi { font-size: clamp(20px, 3.4vw, 27px); }
  .vi-front { font-size: clamp(26px, 5vw, 40px); font-weight: 700; }
  .hv { color: var(--muted); font-size: 16px; }
  .controls { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: 64px 1fr 1fr 64px; gap: 12px; }
  .controls .btn { min-height: 60px; font-size: 18px; }
  .keys { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
  @media (hover: none) { .keys { display: none; } }
  .panel {
    max-width: 820px; margin: 10px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); padding: 30px 24px; text-align: center;
  }
  .panel h2 { margin: 0 0 6px; font-size: 30px; }
  .panel .msg { color: var(--muted); margin: 0 0 16px; }
  .panel .wrongs { font-size: 26px; color: var(--accent); margin: 8px 0 22px; line-height: 1.6; }
  .panel .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

  /* ---------- thanh trên khi chơi ---------- */
  .gamebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin-bottom: 14px; }
  .gamebar .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .gamebar .info { min-width: 0; }
  .gamebar .info b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gamebar .info span { font-size: 14px; color: var(--muted); }
  .score { text-align: center; position: relative; }
  .score b { display: block; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
  .score span { font-size: 12px; color: var(--muted); }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  .pill { display: inline-block; font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 99px; white-space: nowrap; }
  .pill.gold { background: var(--gold-soft); color: var(--gold); }
  .pill.green { background: var(--good-soft); color: var(--good); }
  .hearts { display: flex; gap: 4px; }
  .hearts svg { width: 28px; height: 28px; fill: var(--line); transition: fill .2s ease; }
  .hearts .on svg { fill: var(--accent); }

  /* ---------- trắc nghiệm ---------- */
  .qcard {
    max-width: 820px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); min-height: 230px; padding: 22px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; text-align: center;
  }
  @keyframes shake { 20% { transform: translateX(-9px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.05); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--good-soft); } 50% { box-shadow: 0 0 0 8px var(--good-soft); } }
  @keyframes bump { 40% { transform: scale(1.22); } }
  .qcard .ask { color: var(--muted); font-size: 14px; }
  .timer { max-width: 820px; margin: 14px auto 18px; height: 10px; }
  .timer > i { transition: none; }
  .opts { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt {
    position: relative; min-height: 104px; padding: 16px 18px 16px 52px; border-radius: 16px;
    border: 2px solid var(--line); background: var(--surface); box-shadow: 0 3px 0 var(--line);
    font-size: 19px; font-weight: 600; text-align: center; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .opt .n { position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 8px; background: var(--bg); color: var(--muted); font-size: 14px; display: grid; place-items: center; }
  .opt .hzopt { font-size: 40px; font-weight: 400; }
  .opt .what { font-size: 13px; font-weight: 500; }
  .opt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .opt.wrong { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .opt.dim { color: var(--muted); opacity: .7; }
  /* chọn đúng: nảy nhẹ; chọn sai: đáp án đó rung, đáp án đúng nhấp nháy để mắt tìm tới */
  .opt.right.picked { animation: pop var(--slow) var(--spring); }
  .opt.wrong { animation: shake 450ms var(--ease); }
  .opt.right.reveal { animation: pulse 600ms var(--ease) 2; }
  .score b.bump, .pill.bump { animation: bump var(--normal) var(--spring); }
  .hearts .lost svg { animation: heart-lost 450ms var(--ease); }
  @keyframes heart-lost { 30% { transform: scale(1.35); fill: var(--accent); } 100% { transform: scale(1); } }

  /* ---------- mưa chữ ---------- */
  .field {
    position: relative; flex: 1; overflow: hidden; border-radius: 16px 16px 0 0;
    background: repeating-linear-gradient(90deg, transparent 0 79px, var(--grid) 79px 81px);
    border-bottom: 3px solid var(--accent); touch-action: none;
  }
  .tile {
    position: absolute; left: 0; top: 0; padding: 8px 18px; font-size: 40px; line-height: 1.25;
    background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 4px 0 var(--line);
    will-change: transform; white-space: nowrap; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .tile.bad { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tile.bad > span { display: inline-block; animation: shake 400ms var(--ease); }
  .tile.press { border-color: var(--accent); }
  .tile.hit {
    pointer-events: none; transition: opacity 180ms var(--ease-out), scale 180ms var(--ease-out);
    opacity: 0; scale: 1.25; background: var(--good-soft); border-color: var(--good); color: var(--good);
  }
  .ground { background: var(--surface); border-radius: 0 0 16px 16px; padding: 12px 16px 14px; text-align: center; }
  .ground .ask { color: var(--muted); font-size: 14px; }
  .ground .target { font-size: clamp(22px, 3.6vw, 32px); font-weight: 800; min-height: 1.3em; }
  .banner { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 56px; font-weight: 800; color: var(--accent); opacity: 0; }
  .banner.show { animation: banner 1.3s ease forwards; }
  @keyframes banner { 0% { opacity: 0; transform: scale(.8); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- hiệu ứng ---------- */
  .popup {
    position: fixed; z-index: 50; pointer-events: none; font-weight: 800; font-size: 22px; white-space: nowrap;
    transform: translate(-50%, -50%); animation: popup 1.2s ease-out forwards;
  }
  @keyframes popup { to { opacity: 0; transform: translate(-50%, calc(-50% - 46px)); } }
  .spark {
    position: fixed; z-index: 49; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
    pointer-events: none; animation: spark .7s ease-out forwards;
  }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

  /* ---------- kết quả ---------- */
  .panel { animation: panel-in var(--slow) var(--ease-in); }
  @keyframes panel-in { from { opacity: 0; transform: scale(.95); } }
  .result .pill.gold { display: inline-block; animation: pop 500ms var(--spring) 800ms both; }
  .result .score-big { font-size: 76px; font-weight: 800; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .result .stats3 { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0 22px; }
  .result .stats3 div { background: var(--bg); border-radius: 14px; padding: 10px 22px; min-width: 150px; }
  .result .stats3 b { display: block; font-size: 24px; }
  .result .stats3 span { font-size: 13px; color: var(--muted); }
  .result .wl { text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; margin: 6px 0 24px; }
  .result .wl div { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .result .wl .h { font-size: 22px; color: var(--accent); flex: none; }
  .result .wl .p { color: var(--muted); flex: none; }
  .result .wl .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result h4 { text-align: left; margin: 0 0 6px; font-size: 16px; }

  /* ---------- danh sách ---------- */
  .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.h { font-size: 26px; white-space: nowrap; }
  td.p { color: var(--accent); white-space: nowrap; }
  td.v2 { color: var(--muted); font-style: italic; }
  td.ok { color: var(--good); font-weight: 700; }

  @media (max-width: 640px) {
    .controls { grid-template-columns: 1fr 1fr; }
    .controls .nav { display: none; }
    .opts { grid-template-columns: 1fr; }
    .opt { min-height: 72px; }
    .result .wl { grid-template-columns: 1fr; }
    .gamebar { grid-template-columns: 1fr auto; }
    .gamebar .score { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script src="vocab.js"></script>
<script>
"use strict";

// ================= dữ liệu =================
const word = (bai, hz, py, vi, hv, rieng) => ({ bai, hz, py, vi, hv, rieng, key: `${bai}|${hz}|${vi}` });
const LESSON_LIST = LESSONS.map(l => ({
  bai: l.bai, ten: l.ten,
  words: [
    ...l.tu.map(([hz, py, vi, hv]) => word(l.bai, hz, py, vi, hv, false)),
    ...(l.rieng || []).map(([hz, py, vi]) => word(l.bai, hz, py, vi, "", true)),
  ],
}));
const ALL = LESSON_LIST.flatMap(l => l.words);

// tiến độ lưu trong trình duyệt của từng máy
const STORE_KEY = "flashcard-zh-v2";
const store = (() => {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { d = {}; }
  const st = Object.assign({ rieng: true, reverse: false, from: 1, to: LESSONS.length }, d.settings);
  // phạm vi bài để trộn/ôn: luôn hợp lệ và from ≤ to
  const clamp = n => Math.min(LESSONS.length, Math.max(1, parseInt(n, 10) || 1));
  st.from = clamp(st.from);
  st.to = Math.max(st.from, clamp(st.to));
  return { known: new Set(d.known || []), best: d.best || {}, settings: st };
})();
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ known: [...store.known], best: store.best, settings: store.settings }));
  } catch (e) {}
}
const isKnown = w => store.known.has(w.key);
const setKnown = (w, v) => v ? store.known.add(w.key) : store.known.delete(w.key);
const bestScore = (mode, scope) => store.best[`${mode}|${scope}`] || 0;
function submitScore(mode, scope, score) {
  const k = `${mode}|${scope}`;
  const rec = score > (store.best[k] || 0);
  if (rec) store.best[k] = score;
  save();
  return rec;
}

// ================= tiện ích =================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sample = a => shuffle([...a]);
const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
// lost: vị trí trái tim vừa mất (để chạy hiệu ứng), -1 nếu không có
const hearts = (n, lost = -1) => `<div class="hearts" aria-label="Còn ${n} mạng">${[0, 1, 2].map(i =>
  `<span class="${i < n ? "on" : ""} ${i === lost ? "lost" : ""}">${HEART}</span>`).join("")}</div>`;
// chạy lại một hiệu ứng CSS ngắn trên phần tử (vd điểm số nảy lên)
function bump(el) {
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}
// cỡ chữ Hán lớn theo số chữ
const hzSize = (s, base) => {
  const n = [...s].length;
  const px = n <= 2 ? base : n === 3 ? base * .8 : n === 4 ? base * .64 : base * .5;
  return `font-size:min(${Math.round(px)}px, ${(px / 8.5).toFixed(1)}vw)`;
};

// âm thanh ngắn tự tổng hợp (iPad chỉ cho phát sau lần chạm đầu tiên)
const NOTES = {
  ok: [[660, .07], [990, .12]], bad: [[220, .09], [165, .16]], click: [[1200, .025]],
  level: [[523, .08], [659, .08], [784, .08], [1047, .18]], end: [[784, .1], [659, .1], [523, .22]],
};
let actx = null;
function sfx(name) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    let t = actx.currentTime;
    for (const [f, d] of NOTES[name]) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = name === "bad" ? "square" : "sine";
      o.frequency.value = f;
      const v = name === "bad" ? .05 : name === "click" ? .04 : .12;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(v, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + d + .02);
      t += d;
    }
  } catch (e) {}
}

function popup(text, x, y, color) {
  const el = document.createElement("div");
  el.className = "popup";
  el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y}px;color:${color}`;
  document.body.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
function burst(x, y, color, n = 16) {
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 80;
    el.style.cssText = `left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 20}px`;
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// ================= điều hướng màn hình =================
const app = $("#app");
let cleanup = null, keyHandler = null;
function show(render) {
  if (cleanup) cleanup();
  cleanup = keyHandler = null;
  const el = document.createElement("div");
  el.className = "screen";
  app.replaceChildren(el);
  cleanup = render(el) || null;
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => { if (keyHandler) keyHandler(e); });

// ================= màn chính =================
const lessonOptions = sel => LESSON_LIST.map(l =>
  `<option value="${l.bai}" ${l.bai === sel ? "selected" : ""}>Bài ${l.bai}</option>`).join("");
const rangeWords = () => LESSON_LIST.filter(l => l.bai >= store.settings.from && l.bai <= store.settings.to)
  .flatMap(l => l.words);

function Home(root) {
  const st = store.settings;
  const total = ALL.length, known = ALL.filter(isKnown).length;
  root.innerHTML = `
    <header class="home-head">
      <div class="brand">
        <div class="seal hz">学</div>
        <div><h1>Flashcard Tiếng Trung</h1><p class="sub">Boya <span class="hz">博雅汉语</span> · Sơ cấp I · 30 bài</p></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${total}</b><span>tổng số từ</span></div>
        <div class="stat"><b class="good-t">${known}</b><span>đã thuộc</span></div>
        <div class="stat"><b class="accent-t">${total - known}</b><span>chưa thuộc</span></div>
      </div>
    </header>
    <div class="range-card">
      <div class="range-pick">
        <span>Học từ</span>
        <select id="from" aria-label="Từ bài">${lessonOptions(st.from)}</select>
        <span>đến</span>
        <select id="to" aria-label="Đến bài">${lessonOptions(st.to)}</select>
        <span class="muted" id="rcount"></span>
      </div>
      <div class="range-actions">
        <button class="btn primary" data-act="mix" id="mixbtn"></button>
        <button class="btn" data-act="unknown" id="unkbtn"></button>
      </div>
    </div>
    <h2 class="section">Chọn bài học</h2>
    <div class="lessons">${LESSON_LIST.map(l => {
      const n = l.words.length, k = l.words.filter(isKnown).length;
      return `<button class="lesson ${n && k === n ? "done" : ""}" data-bai="${l.bai}">
        <span class="num">Bài ${l.bai}</span>
        <span class="ten hz">${esc(l.ten)}</span>
        <span class="cnt">${k}/${n} từ đã thuộc</span>
        <span class="bar"><i style="width:${n ? k / n * 100 : 0}%"></i></span>
      </button>`;
    }).join("")}</div>
    <div class="foot-actions"><button class="btn ghost" data-act="reset">Xóa tiến độ</button></div>`;

  // cập nhật số từ, chữ trên nút và tô các bài trong phạm vi
  function updateRange() {
    const ws = rangeWords(), unk = ws.filter(w => !isKnown(w)).length;
    const one = st.from === st.to;
    $("#rcount", root).textContent = `${ws.length} từ`;
    $("#mixbtn", root).textContent = one ? `Học bài ${st.from}` : `Trộn bài ${st.from}–${st.to}`;
    const ub = $("#unkbtn", root);
    ub.textContent = unk ? `Ôn từ chưa thuộc (${unk})` : "Đã thuộc hết phạm vi này";
    ub.disabled = !unk;
    // chỉ tô các bài trong phạm vi khi đã thu hẹp (cả 30 bài thì không cần tô)
    const full = st.from === 1 && st.to === LESSON_LIST.length;
    root.querySelectorAll(".lesson").forEach(b => {
      const n = +b.dataset.bai;
      b.classList.toggle("in", !full && n >= st.from && n <= st.to);
    });
  }
  root.onchange = e => {
    const from = $("#from", root), to = $("#to", root);
    if (e.target === from) {
      st.from = +from.value;
      if (st.to < st.from) { st.to = st.from; to.value = st.to; }
    } else if (e.target === to) {
      st.to = +to.value;
      if (st.from > st.to) { st.from = st.to; from.value = st.from; }
    } else return;
    save();
    updateRange();
  };
  updateRange();

  let resetTimer = 0;
  root.onclick = e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (b.dataset.bai) {
      const l = LESSON_LIST[b.dataset.bai - 1];
      sfx("click");
      show(r => Mode(r, `Bài ${l.bai} · ${l.ten}`, l.words, `bai${l.bai}`, l.words));
    } else if (act === "unknown" || act === "mix") {
      const ws = rangeWords(), { from, to } = st;
      const span = from === to ? `bài ${from}` : `bài ${from}–${to}`;
      sfx("click");
      if (act === "unknown") {
        show(r => Mode(r, `Từ chưa thuộc · ${span}`, ws.filter(w => !isKnown(w)), `unknown${from}-${to}`, ws));
      } else if (from === to) {
        const l = LESSON_LIST[from - 1];
        show(r => Mode(r, `Bài ${l.bai} · ${l.ten}`, l.words, `bai${l.bai}`, l.words));
      } else {
        show(r => Mode(r, `Trộn ${span}`, ws, `range${from}-${to}`, ws));
      }
    } else if (act === "reset") {
      if (b.dataset.confirm) {
        store.known.clear();
        save();
        show(Home);
      } else {
        b.dataset.confirm = "1";
        b.textContent = "Bấm lần nữa để xóa";
        b.classList.add("bad");
        resetTimer = setTimeout(() => {
          delete b.dataset.confirm;
          b.textContent = "Xóa tiến độ";
          b.classList.remove("bad");
        }, 3000);
      }
    }
  };
  return () => clearTimeout(resetTimer);
}

// ================= chọn chế độ =================
const MODES = [
  ["flash", "卡", "Lật thẻ", "Lật thẻ để học, tự đánh dấu từ nào đã thuộc, từ nào chưa.", "--accent"],
  ["quiz", "问", "Trắc nghiệm", "Chọn nghĩa đúng trong 4 đáp án. 3 mạng, đếm giờ, cộng điểm combo.", "--gold"],
  ["rain", "雨", "Mưa chữ", "Chữ Hán rơi xuống — chạm đúng chữ mang nghĩa ở dưới trước khi chạm đất.", "--good"],
  ["list", "表", "Danh sách từ", "Xem toàn bộ từ của bài: chữ Hán, pinyin, Hán Việt và nghĩa.", "--muted"],
];

function Mode(root, title, all, scope, pool) {
  const st = store.settings;
  const words = () => all.filter(w => st.rieng || !w.rieng);
  const hasRieng = all.some(w => w.rieng);
  const back = () => show(r => Mode(r, title, all, scope, pool));

  function render() {
    const ws = words(), k = ws.filter(isKnown).length;
    root.innerHTML = `
      <div class="topbar"><button class="btn ghost" data-act="home">← Trở về</button></div>
      <h1 class="page-title">${esc(title)}</h1>
      <div class="muted">${ws.length} từ · ${k} đã thuộc · ${ws.length - k} chưa thuộc</div>
      <div class="toggles">
        ${hasRieng ? `<button class="chip" data-act="rieng" aria-pressed="${st.rieng}">Gồm tên riêng</button>` : ""}
        <button class="chip" data-act="dir" aria-pressed="${st.reverse}">${st.reverse ? "Hỏi: Việt → Hán" : "Hỏi: Hán → Việt"}</button>
      </div>
      <div class="modes">${MODES.map(([id, ico, name, desc, col]) => {
        const best = bestScore(id, scope);
        const foot = id === "flash" ? `<span class="good-t">${k}/${ws.length} đã thuộc</span>`
          : id === "list" ? `<span class="muted">${ws.length} từ</span>`
          : best ? `<span style="color:var(--gold)">Kỷ lục: ${best}</span>` : `<span class="muted">Chưa có kỷ lục</span>`;
        return `<button class="mode" data-mode="${id}" ${ws.length ? "" : "disabled"}>
          <span class="ico hz" style="background:var(${col})">${ico}</span>
          <h3>${name}</h3><p>${desc}</p><span class="foot">${foot}</span></button>`;
      }).join("")}</div>
      ${ws.length ? "" : `<p class="empty-note">Không còn từ nào ở đây — bạn đã thuộc hết!</p>`}`;
  }

  root.onclick = e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const act = b.dataset.act, mode = b.dataset.mode;
    if (act === "home") return show(Home);
    if (act === "rieng") { st.rieng = !st.rieng; save(); return render(); }
    if (act === "dir") { st.reverse = !st.reverse; save(); return render(); }
    if (!mode) return;
    sfx("click");
    const ws = words();
    if (mode === "flash") show(r => Flashcard(r, title, ws, back));
    else if (mode === "quiz") show(r => Quiz(r, title, ws, pool, scope, back));
    else if (mode === "rain") show(r => Rain(r, title, ws, pool, scope, back));
    else show(r => List(r, title, ws, back));
  };
  keyHandler = e => { if (e.key === "Escape") show(Home); };
  render();
}

// ================= lật thẻ =================
function Flashcard(root, title, words, back) {
  let source, deck, i, flipped, wrong, shuffleOn = false;
  root.innerHTML = `
    <div class="topbar">
      <button class="btn ghost" data-act="back">← Trở về</button>
      <div class="t">${esc(title)}</div>
      <span class="pos" id="pos"></span>
      <button class="chip" data-act="shuffle" aria-pressed="false">Trộn thẻ</button>
    </div>
    <span class="bar progress"><i id="prog"></i></span>
    <div id="stage"></div>`;
  const stage = $("#stage", root);

  function start(ws) {
    source = [...ws];
    deck = shuffleOn ? sample(ws) : [...ws];
    i = 0; flipped = false; wrong = [];
    render();
  }
  const cur = () => deck[i];

  function faceHtml(w, backSide) {
    const tag = `<span class="tag">Bài ${w.bai}${w.rieng ? " · Tên riêng" : ""}</span>`;
    const known = isKnown(w) ? `<span class="known">Đã thuộc</span>` : "";
    if (!backSide) {
      const main = store.settings.reverse
        ? `<div class="vi-front">${esc(w.vi)}</div>`
        : `<div class="big hz" style="${hzSize(w.hz, 150)}">${esc(w.hz)}</div>`;
      return `${tag}${known}${main}<span class="hint">Chạm để lật · vuốt ngang để chuyển thẻ</span>`;
    }
    return `${tag}${known}
      <div class="big hz" style="${hzSize(w.hz, 96)}">${esc(w.hz)}</div>
      <div class="py">${esc(w.py)}</div>
      <div class="vi">${esc(w.vi)}</div>
      ${w.hv ? `<div class="hv">Hán Việt: <i>${esc(w.hv)}</i></div>` : ""}`;
  }

  function render() {
    $("#pos", root).textContent = `${Math.min(i + 1, deck.length)}/${deck.length}`;
    $("#prog", root).style.width = (deck.length ? i / deck.length * 100 : 100) + "%";
    if (i >= deck.length) {
      const bad = wrong.length, n = deck.length;
      const msg = bad ? `${n - bad}/${n} từ đã thuộc · còn ${bad} từ cần ôn lại` : n ? `Bạn đã thuộc cả ${n} từ. Giỏi lắm!` : "Không có từ nào để ôn.";
      stage.innerHTML = `<div class="panel">
        <h2>Xong lượt ôn!</h2><p class="msg">${msg}</p>
        ${bad ? `<div class="wrongs hz">${wrong.slice(0, 16).map(w => esc(w.hz)).join("&emsp;")}${bad > 16 ? " …" : ""}</div>` : ""}
        <div class="row">
          ${bad ? `<button class="btn primary" data-act="again-bad">Ôn lại từ chưa thuộc</button>` : ""}
          <button class="btn" data-act="again">Ôn lại cả bộ</button>
          <button class="btn ghost" data-act="back">Trở về</button>
        </div></div>`;
      return;
    }
    const w = cur();
    stage.innerHTML = `
      <div class="scene"><div class="drag" id="drag"><div class="card ${flipped ? "flipped" : ""}" id="card" role="button" aria-label="Lật thẻ">
        <div class="face front">${faceHtml(w, false)}</div>
        <div class="face back">${faceHtml(w, true)}</div>
      </div></div></div>
      <div class="controls">
        <button class="btn nav" data-act="prev" ${i === 0 ? "disabled" : ""} aria-label="Thẻ trước">←</button>
        <button class="btn bad" data-act="bad">Chưa thuộc</button>
        <button class="btn good" data-act="good">Đã thuộc</button>
        <button class="btn nav" data-act="next" aria-label="Thẻ sau">→</button>
      </div>
      <p class="keys">Space lật thẻ · ← → chuyển thẻ · 1 chưa thuộc · 2 đã thuộc · Esc trở về</p>`;
    bindSwipe($("#drag", stage));
  }

  function flip() {
    if (i >= deck.length || busy) return;
    flipped = !flipped;
    $("#card", stage).classList.toggle("flipped", flipped);
  }
  function move(d) {
    const n = i + d;
    if (n < 0 || n > deck.length) return;
    i = n; flipped = false;
    if (n === deck.length) sfx("end");
    render();
  }
  // thẻ bay ra (200ms) rồi mới sang thẻ mới; trong lúc đó bỏ qua thao tác khác
  let busy = false;
  function leave(d, cls, tone = "") {
    const drag = $("#drag", stage);
    const n = i + d;
    if (busy || !drag || n < 0 || n > deck.length) return snapBack(drag);
    busy = true;
    drag.classList.remove("snap");
    drag.style.transform = "";
    drag.classList.add(cls);
    if (tone) drag.classList.add(tone);
    setTimeout(() => { busy = false; move(d); }, 200);
  }
  function snapBack(drag) {
    if (!drag) return;
    drag.classList.add("snap");
    drag.style.transform = "";
  }
  const next = () => leave(1, "out-left");
  const prev = () => leave(-1, "out-right");
  function mark(v) {
    const w = cur();
    if (!w || busy) return;
    setKnown(w, v);
    save();
    if (v) { wrong = wrong.filter(x => x.key !== w.key); sfx("ok"); }
    else { if (!wrong.includes(w)) wrong.push(w); sfx("click"); }
    leave(1, "out-up", v ? "good" : "bad");
  }
  // thẻ chạy theo ngón tay khi vuốt ngang; chạm nhẹ để lật
  function bindSwipe(drag) {
    let x0 = 0, y0 = 0, dx = 0, down = false, dragging = false;
    drag.addEventListener("pointerdown", e => {
      if (busy) return;
      down = true; dragging = false; dx = 0;
      x0 = e.clientX; y0 = e.clientY;
      drag.classList.remove("snap");
      try { drag.setPointerCapture(e.pointerId); } catch (err) {}
    });
    drag.addEventListener("pointermove", e => {
      if (!down) return;
      dx = e.clientX - x0;
      if (!dragging && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(e.clientY - y0)) dragging = true;
      if (dragging) drag.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
    });
    drag.addEventListener("pointerup", e => {
      if (!down) return;
      down = false;
      if (dragging) Math.abs(dx) > 80 ? (dx < 0 ? next() : prev()) : snapBack(drag);
      else if (Math.abs(e.clientX - x0) < 12 && Math.abs(e.clientY - y0) < 12) flip();
    });
    drag.addEventListener("pointercancel", () => { down = false; snapBack(drag); });
  }

  root.onclick = e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === "back") back();
    else if (act === "shuffle") { shuffleOn = !shuffleOn; b.setAttribute("aria-pressed", shuffleOn); start(source); }
    else if (act === "prev") prev();
    else if (act === "next") next();
    else if (act === "bad") mark(false);
    else if (act === "good") mark(true);
    else if (act === "again-bad") start(wrong);
    else if (act === "again") start(source);
  };
  keyHandler = e => {
    if (e.key === "Escape") return back();
    if (i >= deck.length) return;
    if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === "1") mark(false);
    else if (e.key === "2") mark(true);
  };
  start(words);
}

// ================= trắc nghiệm =================
const Q_TIME = 12;
function Quiz(root, title, words, pool, scope, back) {
  const reverse = store.settings.reverse;
  if (new Set(pool.map(w => w.vi)).size < 8) pool = ALL;
  const deck = sample(words);
  let idx = -1, lives = 3, score = 0, combo = 0, bestCombo = 0, correct = 0, wrong = [];
  let q, options, answered, timer, wait, raf = 0, last = 0, done = false;

  root.innerHTML = `
    <div class="gamebar">
      <div class="left"><button class="btn ghost" data-act="back">← Thoát</button>
        <div class="info"><b>${esc(title)}</b><span id="qpos"></span></div></div>
      <div class="score"><b id="score">0</b><span>điểm</span></div>
      <div class="right"><span class="pill gold" id="combo" hidden></span><span id="hearts"></span></div>
    </div>
    <div class="qcard" id="qcard"></div>
    <span class="bar timer"><i id="tbar"></i></span>
    <div class="opts" id="opts"></div>
    <p class="keys">Phím 1–4 để chọn · Space: câu tiếp · Esc: thoát</p>`;
  const qcard = $("#qcard", root), opts = $("#opts", root), tbar = $("#tbar", root);

  function distractors(q) {
    const key = reverse ? (w => w.hz) : (w => w.vi);
    const seen = new Set([key(q)]), out = [];
    for (const src of [pool, ALL]) {
      for (const w of sample(src)) {
        if (w.hz === q.hz || w.vi === q.vi || seen.has(key(w))) continue;
        seen.add(key(w)); out.push(w);
        if (out.length === 3) return out;
      }
    }
    return out;
  }
  let shownLives = lives;
  function hud() {
    $("#score", root).textContent = score;
    $("#hearts", root).innerHTML = hearts(lives, lives < shownLives ? lives : -1);
    shownLives = lives;
    const c = $("#combo", root);
    c.hidden = combo < 2;
    c.textContent = `Combo x${combo}`;
    $("#qpos", root).textContent = `Câu ${Math.min(idx + 1, deck.length)}/${deck.length}`;
  }
  function next() {
    idx++;
    if (idx >= deck.length || lives <= 0) return finish();
    q = deck[idx];
    options = shuffle([q, ...distractors(q)]);
    answered = null; timer = Q_TIME;
    render(); hud();
  }
  function render() {
    const doneQ = answered !== null;
    if (!reverse) {
      qcard.innerHTML = `<div class="big hz" style="${hzSize(q.hz, doneQ ? 84 : 110)}">${esc(q.hz)}</div>
        ${doneQ ? `<div class="py">${esc(q.py)}</div>${q.hv ? `<div class="hv">Hán Việt: <i>${esc(q.hv)}</i></div>` : ""}`
                : `<div class="ask">Nghĩa của từ này là gì?</div>`}`;
    } else {
      qcard.innerHTML = `<div class="vi-front">${esc(q.vi)}</div>
        ${doneQ ? `<div class="big hz" style="${hzSize(q.hz, 60)}">${esc(q.hz)}</div><div class="py">${esc(q.py)}</div>`
                : `<div class="ask">Chọn chữ Hán đúng</div>`}`;
    }
    opts.innerHTML = options.map((w, i) => {
      let cls = "";
      if (doneQ) cls = w === q ? (i === answered ? "right picked" : "right reveal") : i === answered ? "wrong" : "dim";
      const label = reverse ? `<span class="hzopt hz">${esc(w.hz)}</span>` : `<span>${esc(w.vi)}</span>`;
      const what = doneQ && i === answered && w !== q
        ? `<span class="what">${reverse ? esc(w.vi) : `${esc(w.hz)} · ${esc(w.py)}`}</span>` : "";
      return `<button class="opt ${cls}" data-i="${i}"><span class="n">${i + 1}</span>${label}${what}</button>`;
    }).join("");
  }
  function answer(i) {
    if (answered !== null || done) return;
    answered = i;
    const ok = i >= 0 && options[i] === q;
    const optEl = i >= 0 ? opts.children[i] : null;
    if (ok) {
      combo++; bestCombo = Math.max(bestCombo, combo); correct++;
      const gain = 100 + 20 * (combo - 1) + Math.floor(timer * 5);
      score += gain;
      const [sx, sy] = center($("#score", root));
      popup(`+${gain}`, sx, sy + 30, css("--good"));
      burst(...center(optEl), css("--good"));
      sfx("ok");
      setKnown(q, true);
      wait = 1.2;
    } else {
      combo = 0; lives--;
      wrong.push(q);
      sfx("bad");
      setKnown(q, false);
      wait = 2.2;
    }
    save();
    render(); hud();
    if (ok) {
      bump($("#score", root));
      if (combo >= 2) bump($("#combo", root));
    }
  }
  function loop(t) {
    if (done) return;
    const dt = Math.min(.05, (t - (last || t)) / 1000);
    last = t;
    if (answered === null) {
      timer -= dt;
      if (timer <= 0) { timer = 0; answer(-1); }
    } else {
      wait -= dt;
      if (wait <= 0) next();
    }
    if (done) return;
    const f = timer / Q_TIME;
    tbar.style.width = f * 100 + "%";
    tbar.style.background = f > .5 ? "var(--good)" : f > .25 ? "var(--gold)" : "var(--accent)";
    raf = requestAnimationFrame(loop);
  }
  function finish() {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    const best = bestScore("quiz", scope), record = submitScore("quiz", scope, score);
    const answeredN = correct + wrong.length;
    sfx("end");
    show(r => Results(r, {
      heading: `${lives <= 0 ? "Hết mạng!" : "Hoàn thành!"} · Trắc nghiệm`, score, best, record, wrong,
      stats: [["câu đúng", `${correct}/${answeredN}`], ["combo cao nhất", bestCombo],
              ["độ chính xác", `${Math.round(100 * correct / Math.max(1, answeredN))}%`]],
      replay: () => show(r2 => Quiz(r2, title, words, pool, scope, back)),
      review: ws => show(r2 => Flashcard(r2, "Ôn các từ sai", ws, back)),
      back,
    }));
  }

  root.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.act === "back") return back();
    if (b.dataset.i !== undefined) answered === null ? answer(+b.dataset.i) : next();
  };
  keyHandler = e => {
    if (e.key === "Escape") return back();
    if (["1", "2", "3", "4"].includes(e.key)) answer(+e.key - 1);
    else if ((e.key === " " || e.key === "Enter") && answered !== null) { e.preventDefault(); next(); }
  };
  next();
  raf = requestAnimationFrame(loop);
  return () => { done = true; cancelAnimationFrame(raf); };
}

// ================= mưa chữ =================
function Rain(root, title, words, pool, scope, back) {
  root.classList.add("full");
  const decoyMap = new Map([...words, ...pool].map(w => [w.key, w]));
  if (decoyMap.size < 10) sample(ALL).slice(0, 30).forEach(w => decoyMap.set(w.key, w));
  const decoys = [...decoyMap.values()];
  const queue = sample(words), total = queue.length;
  let tiles = [], lives = 3, score = 0, level = 1, hits = 0, missed = [];
  let spawnT = 1.6, target = null, needTarget = false, over = false, raf = 0, last = 0, endTimer = 0;

  root.innerHTML = `
    <div class="gamebar">
      <div class="left"><button class="btn ghost" data-act="back">← Thoát</button>
        <div class="info"><b>${esc(title)}</b><span id="left"></span></div></div>
      <div class="score"><b id="score">0</b><span>điểm</span></div>
      <div class="right"><span class="pill green" id="level">Cấp 1</span><span id="hearts"></span></div>
    </div>
    <div class="field" id="field"><div class="banner" id="banner"></div></div>
    <div class="ground"><div class="ask">Chạm vào chữ Hán có nghĩa:</div><div class="target" id="target"></div></div>`;
  const field = $("#field", root);

  // tốc độ tính theo chiều cao vùng chơi để màn hình to/nhỏ chơi như nhau
  const speed = () => (34 + level * 13) * field.clientHeight / 540;
  let shownLives = lives;
  function hud() {
    $("#score", root).textContent = score;
    $("#hearts", root).innerHTML = hearts(lives, lives < shownLives ? lives : -1);
    shownLives = lives;
    $("#level", root).textContent = `Cấp ${level}`;
    $("#left", root).textContent = `Còn ${queue.length + (target ? 1 : 0)}/${total} từ`;
  }
  function banner(text) {
    const b = $("#banner", root);
    b.textContent = text;
    b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
  }
  function nextTarget() {
    if (!queue.length) { target = null; $("#target", root).textContent = ""; return finish(); }
    target = queue.pop();
    needTarget = true;
    spawnT = Math.min(spawnT, .5);
    $("#target", root).textContent = target.vi;
    hud();
  }
  function spawn() {
    const onScreen = new Set(tiles.map(t => t.word.key));
    let w;
    if (!onScreen.has(target.key) && (needTarget || Math.random() < .4)) { w = target; needTarget = false; }
    else {
      const c = decoys.filter(d => !onScreen.has(d.key) && d.vi !== target.vi && d.hz !== target.hz);
      if (!c.length) return;
      w = c[Math.floor(Math.random() * c.length)];
    }
    const el = document.createElement("button");
    el.className = "tile hz";
    el.innerHTML = `<span>${esc(w.hz)}</span>`;  // span riêng để rung khi bấm sai (ô đã dùng transform để rơi)
    field.appendChild(el);
    const tw = el.offsetWidth, th = el.offsetHeight, fw = field.clientWidth;
    // tránh đè lên các ô vừa xuất hiện ở trên cùng
    const recent = tiles.filter(t => t.y < th * 1.5);
    let x = 0;
    for (let k = 0; k < 15; k++) {
      x = 10 + Math.random() * Math.max(1, fw - tw - 20);
      if (!recent.some(t => x - 10 < t.x + t.width && t.x < x + tw + 10)) break;
    }
    const tile = { word: w, el, x, y: -th, width: tw, h: th, vy: speed() * (.85 + Math.random() * .3), bad: 0 };
    el.addEventListener("pointerdown", e => { e.preventDefault(); tap(tile); });
    tiles.push(tile);
    place(tile);
  }
  const place = t => { t.el.style.transform = `translate(${t.x}px, ${t.y}px)`; };
  function removeTile(t) { t.el.remove(); tiles = tiles.filter(x => x !== t); }

  function tap(t) {
    if (over || t.bad || !target) return;
    if (t.word.vi === target.vi) hit(t); else wrongTap(t);
  }
  function hit(t) {
    const [cx, cy] = center(t.el);
    // ô đúng phóng to rồi mờ đi trước khi biến mất
    tiles = tiles.filter(x => x !== t);
    t.el.classList.add("hit");
    setTimeout(() => t.el.remove(), 200);
    hits++;
    const gain = 10 * level + Math.max(0, Math.round(20 * (1 - t.y / field.clientHeight)));
    score += gain;
    burst(cx, cy, css("--good"), 20);
    popup(`+${gain}  ${t.word.py}`, cx, cy, css("--good"));
    sfx("ok");
    setKnown(target, true);
    save();
    if (hits % 5 === 0) { level++; banner(`Cấp ${level}!`); sfx("level"); bump($("#level", root)); }
    nextTarget();
    hud();
    bump($("#score", root));
  }
  function wrongTap(t) {
    t.bad = .45;
    t.el.classList.add("bad");
    const [cx, cy] = center(t.el);
    popup(`${t.word.hz} = ${t.word.vi}`, cx, cy, css("--accent"));
    if (!missed.includes(target)) missed.push(target);
    loseLife();
  }
  function miss() {
    const r = field.getBoundingClientRect();
    popup(`Lỡ mất: ${target.hz}  ${target.py}`, r.left + r.width / 2, r.bottom - 40, css("--accent"));
    if (!missed.includes(target)) missed.push(target);
    setKnown(target, false);
    save();
    loseLife();
    if (!over) nextTarget();
  }
  function loseLife() {
    lives--;
    sfx("bad");
    hud();
    if (lives <= 0) finish();
  }
  function finish() {
    if (over) return;
    over = true;
    const best = bestScore("rain", scope), record = submitScore("rain", scope, score);
    sfx("end");
    // để người chơi kịp thấy hiệu ứng cuối rồi mới sang màn kết quả
    endTimer = setTimeout(() => show(r => Results(r, {
      heading: `${lives <= 0 ? "Hết mạng!" : "Hoàn thành!"} · Mưa chữ`, score, best, record, wrong: missed,
      stats: [["từ bắt được", `${hits}/${total}`], ["cấp độ", level], ["mạng còn lại", Math.max(0, lives)]],
      replay: () => show(r2 => Rain(r2, title, words, pool, scope, back)),
      review: ws => show(r2 => Flashcard(r2, "Ôn các từ bị lỡ", ws, back)),
      back,
    })), 900);
  }
  function loop(t) {
    const dt = Math.min(.05, (t - (last || t)) / 1000);
    last = t;
    if (!over) {
      spawnT -= dt;
      if (spawnT <= 0) {
        spawn();
        spawnT = Math.max(.6, 1.7 - level * .12) * (.8 + Math.random() * .4);
      }
      const ground = field.clientHeight;
      for (const tile of [...tiles]) {
        if (tile.bad) {
          tile.bad -= dt;
          if (tile.bad <= 0) removeTile(tile);
          continue;
        }
        tile.y += tile.vy * dt;
        place(tile);
        if (tile.y + tile.h >= ground) {
          removeTile(tile);
          if (target && tile.word.key === target.key) { miss(); if (over) break; }
        }
      }
    }
    raf = requestAnimationFrame(loop);
  }

  root.onclick = e => { if (e.target.closest("[data-act=back]")) back(); };
  keyHandler = e => { if (e.key === "Escape") back(); };
  hud();
  nextTarget();
  banner("Bắt đầu!");
  raf = requestAnimationFrame(loop);
  return () => { over = true; cancelAnimationFrame(raf); clearTimeout(endTimer); };
}

// ================= kết quả =================
function Results(root, o) {
  const shownWrong = o.wrong.slice(0, 12);
  root.innerHTML = `<div class="panel result">
    <h2>${esc(o.heading)}</h2>
    <div class="score-big" id="sb">0</div>
    ${o.record && o.score ? `<span class="pill gold">Kỷ lục mới!</span>` : `<span class="muted">Kỷ lục: ${o.best}</span>`}
    <div class="stats3">${o.stats.map(([l, v]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>
    ${o.wrong.length ? `<h4>Từ cần ôn lại (${o.wrong.length})</h4>
      <div class="wl">${shownWrong.map(w => `<div><span class="h hz">${esc(w.hz)}</span><span class="p">${esc(w.py)}</span><span class="v">${esc(w.vi)}</span></div>`).join("")}</div>
      ${o.wrong.length > 12 ? `<p class="muted">… và ${o.wrong.length - 12} từ nữa</p>` : ""}`
      : `<p class="good-t" style="font-weight:700;margin:6px 0 24px">Không sai câu nào. Tuyệt vời!</p>`}
    <div class="row">
      <button class="btn primary" data-act="replay">Chơi lại</button>
      ${o.wrong.length ? `<button class="btn" data-act="review">Lật thẻ các từ sai</button>` : ""}
      <button class="btn ghost" data-act="back">Chọn chế độ khác</button>
    </div></div>`;
  // điểm đếm dần lên
  const sb = $("#sb", root);
  let raf = 0, t0 = 0;
  const tick = t => {
    t0 = t0 || t;
    const f = Math.min(1, (t - t0) / 800);
    sb.textContent = Math.round(o.score * f);
    if (f < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  // kỷ lục mới: pháo hoa nhỏ đúng lúc nhãn "Kỷ lục mới!" bật lên
  const party = o.record && o.score ? setTimeout(() => {
    const p = $(".pill.gold", root);
    if (!p) return;
    burst(...center(p), css("--gold"), 26);
    burst(...center(p), css("--accent"), 14);
    sfx("level");
  }, 900) : 0;
  root.onclick = e => {
    const act = e.target.closest("button")?.dataset.act;
    if (act === "replay") o.replay();
    else if (act === "review") o.review(o.wrong);
    else if (act === "back") o.back();
  };
  keyHandler = e => {
    if (e.key === "Enter") o.replay();
    else if (e.key === "Escape") o.back();
  };
  return () => { cancelAnimationFrame(raf); clearTimeout(party); };
}

// ================= danh sách từ =================
function List(root, title, words, back) {
  root.innerHTML = `
    <div class="topbar"><button class="btn ghost" data-act="back">← Trở về</button><div class="t">${esc(title)}</div></div>
    <p class="muted" style="margin:0 0 12px">${words.length} từ</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Chữ Hán</th><th>Pinyin</th><th>Hán Việt</th><th>Nghĩa</th><th></th></tr></thead>
      <tbody>${words.map(w => `<tr>
        <td class="h hz">${esc(w.hz)}</td><td class="p">${esc(w.py)}</td>
        <td class="v2">${w.rieng ? "tên riêng" : esc(w.hv)}</td><td>${esc(w.vi)}</td>
        <td class="ok">${isKnown(w) ? "✓" : ""}</td></tr>`).join("")}</tbody>
    </table></div>`;
  root.onclick = e => { if (e.target.closest("[data-act=back]")) back(); };
  keyHandler = e => { if (e.key === "Escape") back(); };
}
